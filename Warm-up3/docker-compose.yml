services:
  ctf-expert-challenge:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ctf_expert_elite
    ports:
      - "2224:22"    # SSH access only
    hostname: expert-challenge
    restart: unless-stopped
    environment:
      - TERM=xterm-256color
      - DEBIAN_FRONTEND=noninteractive
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ctf_expert_network
    # Add capabilities for privilege escalation testing
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

networks:
  ctf_expert_network:
    driver: bridge
    name: ctf_expert_network
